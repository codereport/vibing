<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink DSL -> BQN & Parrot</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            z-index: 1;
        }
        .top-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bottom-section {
            display: flex;
            gap: 8rem;
            align-items: flex-start;
        }
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .logo {
            width: 300px;
            height: 300px;
            object-fit: contain;
            border-radius: 10px;
            padding: 10px;
        }
        .logo-large {
            width: 400px;
            height: 400px;
        }
        .arrow-container {
            display: flex;
            gap: 10rem;
            margin-top: -20px;
            margin-bottom: -20px;
        }
        .arrow {
            font-size: 100px;
            color: #ffffff;
            transform: rotate(45deg);
        }
        .arrow.left {
            transform: rotate(135deg); /* Pointing down-leftish */
        }
        .arrow.right {
            transform: rotate(-135deg); /* Pointing down-rightish? No, -135 is up-left. Let's try simpler rotations */
        }
        /* 
           Standard arrow is usually -> (right) or ^ (up) depending on font. 
           If we use unicode ↓ or ↙ ↘ it is easier.
           Let's use SVG arrows for better control or just unicode.
        */
        .arrow-icon {
            font-size: 150px;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1;
        }

        .label {
            font-size: 1.5rem;
            margin-top: 0.5rem;
            text-shadow: 0 0 5px #0f0;
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="container">
        <!-- Top: Blink DSL -->
        <div class="logo-container">
            <div class="logo logo-large" style="display: flex; align-items: center; justify-content: center; width: auto;">
                <span style="font-size: 6em; color: #00ff00; white-space: nowrap;">blink dsl</span>
            </div>
        </div>

        <!-- Arrows -->
        <div style="display: flex; gap: 200px; margin-top: -50px; margin-bottom: -20px; align-items: center; height: 150px;">
            <!-- Left Arrow: Mirrored SE Arrow -->
            <div style="width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; transform: scaleX(-1);">
                <div style="transform: rotate(45deg);">
                    <div class="arrow-icon">→</div>
                </div>
            </div>
            
            <!-- Right Arrow: SE Arrow -->
            <div style="width: 150px; height: 150px; display: flex; align-items: center; justify-content: center;">
                <div style="transform: rotate(45deg);">
                    <div class="arrow-icon">→</div>
                </div>
            </div>
        </div>

        <!-- Bottom: BQN and Parrot -->
        <div class="bottom-section">
            <div class="logo-container">
                <img src="assets/bqn_logo.svg" alt="BQN Logo" class="logo">
            </div>
            <div class="logo-container">
                <img src="https://nvlabs.github.io/parrot/_static/logo.png" alt="Parrot Logo" class="logo">
            </div>
        </div>
    </div>
    <script src="nav.js"></script>
    <script src="matrix_rain.js"></script>
</body>
</html>
