<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Fight Clip - Enter the Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            flex-direction: column;
        }

        /* Matrix Rain Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .video-container {
            width: 95%;
            max-width: 1400px;
            height: 90vh;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-container video {
            max-width: 100%;
            max-height: 100%;
            outline: none;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .video-container {
                width: 95%;
            }
        }
    </style>
</head>

<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="video-container">
        <video controls autoplay>
            <source src="assets/matrix_fight.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script src="nav.js"></script>
    <script src="matrix_rain.js"></script>
    <script>
        const video = document.querySelector('video');
        video.muted = false;
        video.play();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ') {
                e.preventDefault(); // Prevent scrolling
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
        });
    </script>
</body>

</html>
