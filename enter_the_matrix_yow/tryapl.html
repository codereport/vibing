<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TryAPL - Enter the Matrix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Matrix Rain Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .iframe-container {
            width: 90%;
            height: 90%;
            z-index: 10;
            /* background: rgba(0, 0, 0, 0.8); */
            /* border: 2px solid #00ff00; */
            /* box-shadow: 0 0 20px rgba(0, 255, 0, 0.3); */
            /* padding: 20px; */
            overflow: hidden;
        }

        iframe {
            width: 40%;
            height: 40%;
            border: none;
            transform: scale(2.5);
            transform-origin: 0 0;
        }
    </style>
</head>

<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="iframe-container">
        <iframe src="https://tryapl.org/" title="TryAPL"></iframe>
    </div>

    <script src="nav.js"></script>
    <script src="matrix_rain.js"></script>
</body>

</html>
