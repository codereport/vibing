<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips for AI coding - Enter the Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            flex-direction: column;
        }

        /* Matrix Rain Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .content-container {
            z-index: 10;
            width: 90%;
            max-width: 1000px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.6);
            /* border: 2px solid #00ff00; */
            /* box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); */
        }

        .page-title {
            font-size: 3.5em;
            color: #00ff00;
            margin-bottom: 40px;
            text-align: center;
            /* text-shadow: 0 0 10px #00ff00; */
        }

        .tips-list {
            list-style-type: none;
            padding: 0;
        }

        .tips-list li {
            font-size: 2em;
            margin-bottom: 30px;
            color: #00cc00;
            display: flex;
            align-items: flex-start;
        }

        .tips-list li::before {
            content: ">";
            margin-right: 20px;
            color: #00ff00;
            font-weight: bold;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2.5em;
            }

            .tips-list li {
                font-size: 1.5em;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 2em;
            }

            .tips-list li {
                font-size: 1.2em;
            }
        }
    </style>
</head>

<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="content-container">
        <h1 class="page-title">Tips for AI Assisted Coding</h1>
        <ul class="tips-list">
            <li>Use Cursor (or Antigravity for web based coding)</li>
            <li>Use Gemini 3 or Claude 4.5</li>
            <li>Be clear about confidence level</li>
            <li>The more detail the better</li>
            <li>Liberally restart chats</li>
        </ul>
    </div>

    <script src="nav.js"></script>
    <script>
        // Matrix Digital Rain Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();

        const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン";
        const matrixArray = matrix.split("");

        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);

        let drops = [];
        function initDrops() {
            drops = [];
            columns = Math.floor(canvas.width / fontSize);
            for (let x = 0; x < columns; x++) {
                drops[x] = Math.floor(Math.random() * canvas.height / fontSize);
            }
        }

        initDrops();

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00FF00';
            ctx.font = fontSize + 'px "MS Gothic", "Courier New", monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = matrixArray[Math.floor(Math.random() * matrixArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 50);

        // Handle window resize
        window.addEventListener('resize', () => {
            resizeCanvas();
            initDrops();
        });
    </script>
</body>

</html>
