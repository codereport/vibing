<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADSP High on AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }
        .image-container {
            z-index: 1;
            max-width: 99%;
            max-height: 99vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pill-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <div class="image-container">
        <img src="assets/adsp_eps.png" alt="ADSP High on AI" class="pill-image">
    </div>

    <script src="nav.js"></script>
    <script src="matrix_rain.js"></script>
</body>
</html>
