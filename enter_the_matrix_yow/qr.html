<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Enter the Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Matrix Rain Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .url-text {
            font-size: 4.5em;
            color: #00ff00;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #00ff00;
            text-decoration: none;
        }

        .url-text:hover {
            text-decoration: underline;
        }

        .qr-image {
            width: 600px;
            height: 600px;
            border: 4px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .url-text {
                font-size: 3em;
            }
            .qr-image {
                width: 400px;
                height: 400px;
            }
        }

        @media (max-width: 480px) {
            .url-text {
                font-size: 2.25em;
            }
            .qr-image {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <a href="https://tinyurl.com/conorhoekstra" class="url-text" target="_blank">https://tinyurl.com/conorhoekstra</a>
        <img src="qrcode.png" alt="QR Code" class="qr-image">
    </div>

    <script src="nav.js"></script>
    <script src="matrix_rain.js"></script>
</body>

</html>
