<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parrot Sushi Example</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400&display=swap');
        @import url('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/dracula.min.css');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ffffff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }
        .logo-container {
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 10;
        }
        .logo {
            width: 240px;
            height: auto;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        .logo:hover {
            opacity: 1;
        }
        
        .code-image-container {
            z-index: 1;
            max-width: 90%;
            width: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 100px;
        }
        
        .code-image {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.1);
        }

        @media (max-width: 800px) {
            .logo {
                width: 150px;
            }
            .logo-container {
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <div class="logo-container">
        <img src="https://nvlabs.github.io/parrot/_static/logo.png" alt="Parrot Logo" class="logo">
    </div>

    <div class="code-image-container">
        <img src="assets/code.png" alt="Parrot Sushi Code" class="code-image">
    </div>

    <script src="nav.js"></script>
    <script src="matrix_rain.js"></script>
</body>
</html>
