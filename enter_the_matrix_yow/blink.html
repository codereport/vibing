<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blink - Enter the Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono:wght@400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: #00ff00;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            flex-direction: column;
            gap: 20px;
        }

        /* Matrix Rain Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }

        .title {
            font-size: 6em;
            color: #00ff00;
            /* text-shadow: 0 0 10px #00ff00; */
            text-align: center;
            z-index: 10;
        }

        .subtitle {
            font-size: 3em;
            color: #00cc00;
            text-align: center;
            z-index: 10;
            opacity: 0.8;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .title {
                font-size: 4em;
            }

            .subtitle {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="title">blink</div>
    <div class="subtitle">(demo)</div>

    <script src="nav.js"></script>
    <script src="matrix_rain.js"></script>
</body>

</html>
