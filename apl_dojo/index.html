<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APL Dojo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>APL Dojo</h1>
            <div class="header-actions">
                <button class="btn-header" id="btn-export" title="Export current state as data.json">Export</button>
                <button class="btn-header btn-header-dim" id="btn-reset" title="Reset to published defaults">Reset</button>
            </div>
        </header>
        <div class="layout">
            <div class="tier-grid" id="tier-grid">
                <div class="tier-row" data-tier="black">
                    <div class="tier-label tier-label-black">BLACK</div>
                    <div class="tier-dropzone" data-tier="black"></div>
                </div>
                <div class="tier-row" data-tier="purple">
                    <div class="tier-label tier-label-purple">PURPLE</div>
                    <div class="tier-dropzone" data-tier="purple"></div>
                </div>
                <div class="tier-row" data-tier="blue">
                    <div class="tier-label tier-label-blue">BLUE</div>
                    <div class="tier-dropzone" data-tier="blue"></div>
                </div>
                <div class="tier-row" data-tier="green">
                    <div class="tier-label tier-label-green">GREEN</div>
                    <div class="tier-dropzone" data-tier="green"></div>
                </div>
                <div class="tier-row" data-tier="white">
                    <div class="tier-label tier-label-white">WHITE</div>
                    <div class="tier-dropzone" data-tier="white"></div>
                </div>
            </div>

            <div class="staging-pane" id="staging-pane">
                <div class="staging-header">
                    <span class="staging-title">Items</span>
                    <button class="btn-add" id="btn-add" title="Add new item">+</button>
                </div>

                <div class="creation-form" id="creation-form" hidden>
                    <div class="form-group">
                        <label class="form-label">Type</label>
                        <div class="radio-group">
                            <label><input type="radio" name="item-type" value="primitive" checked> Primitive</label>
                            <label><input type="radio" name="item-type" value="expression"> Expression</label>
                            <label><input type="radio" name="item-type" value="concept"> Concept</label>
                        </div>
                    </div>

                    <div class="form-group" id="subtype-group">
                        <label class="form-label">Sub-type</label>
                        <div class="radio-group">
                            <label><input type="radio" name="item-subtype" value="monadic-function" checked> Monadic Fn</label>
                            <label><input type="radio" name="item-subtype" value="dyadic-function"> Dyadic Fn</label>
                            <label><input type="radio" name="item-subtype" value="1-modifier"> 1-Modifier</label>
                            <label><input type="radio" name="item-subtype" value="2-modifier"> 2-Modifier</label>
                        </div>
                    </div>

                    <div class="form-group" id="rank-group" style="display:none">
                        <div class="lang-header">
                            <label class="form-label">Rank</label>
                            <div class="lang-toggle-btns">
                                <button type="button" class="btn-lang-toggle" id="btn-rank-all">All</button>
                                <button type="button" class="btn-lang-toggle" id="btn-rank-none">None</button>
                            </div>
                        </div>
                        <div class="rank-checkboxes" id="rank-checkboxes">
                            <label class="rank-cb"><input type="checkbox" value="0"> 0</label>
                            <label class="rank-cb"><input type="checkbox" value="1"> 1</label>
                            <label class="rank-cb"><input type="checkbox" value="2"> 2</label>
                            <label class="rank-cb"><input type="checkbox" value="3+"> 3+</label>
                            <label class="rank-cb"><input type="checkbox" value="N"> N</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="item-text">Text</label>
                        <input type="text" id="item-text" class="form-input" placeholder="e.g. +/ or Rank" autocomplete="off" spellcheck="false">
                    </div>

                    <div class="form-group" id="name-group" style="display:none">
                        <label class="form-label" for="item-name">Name</label>
                        <input type="text" id="item-name" class="form-input form-input-name" placeholder="e.g. Reduce, Transpose" autocomplete="off" spellcheck="false">
                    </div>

                    <div class="form-group" id="lang-group">
                        <label class="form-label" for="lang-expr">Language (for expressions)</label>
                        <select id="lang-expr" class="form-select">
                            <option value="">-- highlight as --</option>
                            <option value="apl">APL</option>
                            <option value="bqn">BQN</option>
                            <option value="j">J</option>
                            <option value="uiua">Uiua</option>
                            <option value="kap">Kap</option>
                            <option value="tinyapl">TinyAPL</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <div class="lang-header">
                            <label class="form-label">Languages</label>
                            <div class="lang-toggle-btns">
                                <button type="button" class="btn-lang-toggle" id="btn-lang-all">All</button>
                                <button type="button" class="btn-lang-toggle" id="btn-lang-none">None</button>
                            </div>
                        </div>
                        <div class="lang-checkboxes" id="lang-checkboxes">
                            <label class="lang-cb" title="APL"><input type="checkbox" value="apl"><img src="array-box/assets/apl.png" alt="APL" class="lang-logo-sm"></label>
                            <label class="lang-cb" title="BQN"><input type="checkbox" value="bqn"><img src="array-box/assets/bqn.svg" alt="BQN" class="lang-logo-sm"></label>
                            <label class="lang-cb" title="J"><input type="checkbox" value="j"><img src="array-box/assets/j_logo.svg" alt="J" class="lang-logo-sm"></label>
                            <label class="lang-cb" title="Uiua"><input type="checkbox" value="uiua"><img src="array-box/assets/uiua.png" alt="Uiua" class="lang-logo-sm"></label>
                            <label class="lang-cb" title="Kap"><input type="checkbox" value="kap"><img src="array-box/assets/kap.png" alt="Kap" class="lang-logo-sm"></label>
                            <label class="lang-cb" title="TinyAPL"><input type="checkbox" value="tinyapl"><img src="array-box/assets/tinyapl.svg" alt="TinyAPL" class="lang-logo-sm"></label>
                        </div>
                    </div>

                    <button class="btn-create" id="btn-create">Create</button>
                </div>

                <div class="staging-items" id="staging-items"></div>
            </div>
        </div>
        <footer class="legend">
            <span class="legend-title">Legend</span>
            <div class="legend-row legend-row-active" id="legend-4color" data-mode="4color">
                <div class="legend-items">
                    <span class="legend-chip lc-cyan">Monadic Function</span>
                    <span class="legend-chip lc-green">Dyadic Function</span>
                    <span class="legend-chip lc-yellow">1-Modifier</span>
                    <span class="legend-chip lc-pink">2-Modifier</span>
                    <span class="legend-chip lc-expr">Expression</span>
                    <span class="legend-chip lc-concept">Concept</span>
                </div>
            </div>
            <div class="legend-row" id="legend-3color" data-mode="3color">
                <div class="legend-items">
                    <span class="legend-chip lc-cyan legend-chip-wide">Function</span>
                    <span class="legend-chip lc-green">1-Modifier</span>
                    <span class="legend-chip lc-yellow">2-Modifier</span>
                    <span class="legend-chip lc-expr">Expression</span>
                    <span class="legend-chip lc-concept">Concept</span>
                </div>
            </div>
        </footer>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
