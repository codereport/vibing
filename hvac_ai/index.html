<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>HVAC Efficiency Pro</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12), transparent 34rem),
                #f8fafc;
        }

        main {
            width: min(100%, 680px);
            padding: clamp(32px, 7vw, 64px);
            border: 1px solid #e2e8f0;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        .mark {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            border-radius: 22px;
            background: #0f172a;
            color: white;
            font-size: 30px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.2);
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 6vw, 48px);
            line-height: 1.05;
            letter-spacing: -0.045em;
        }

        h1 span {
            color: #059669;
        }

        .actions {
            display: grid;
            gap: 16px;
            margin-top: 40px;
        }

        a {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 750;
            text-decoration: none;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        a:first-child {
            background: #0f172a;
            color: white;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.2);
        }

        a:last-child {
            border: 2px solid #10b981;
            background: #ecfdf5;
            color: #047857;
        }

        a:hover {
            transform: translateY(-2px);
        }

        a:first-child:hover {
            background: #1e293b;
            box-shadow: 0 16px 34px rgba(15, 23, 42, 0.24);
        }

        a:last-child:hover {
            background: #d1fae5;
        }

        a:focus-visible {
            outline: 4px solid rgba(14, 165, 233, 0.35);
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">♨</div>
        <h1>HVAC <span>Efficiency</span> Pro</h1>
        <div class="actions" aria-label="Choose an app">
            <a href="hvac-efficiency-pro-hca.html">HVAC Efficiency Pro HCA</a>
            <a href="hvac-efficiency-pro-customer.html">HVAC Efficiency Pro Customer</a>
        </div>
    </main>
</body>
</html>
