<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survivor 50: In the Hands of the Fans</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
      background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
      border-bottom: 2px solid #333;
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #f59e0b, #ef4444, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header .subtitle {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: #888;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .episode-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 24px 20px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
    }

    .ep-btn {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 24px;
      border: 2px solid #444;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .ep-btn:hover { border-color: #888; color: #fff; }
    .ep-btn.active { background: #fff; color: #0a0a0a; border-color: #fff; }
    .ep-btn.active:hover { background: #ddd; border-color: #ddd; }

    .alliances-legend {
      display: none;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .alliances-legend.visible { display: flex; }

    .alliance-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #aaa;
    }

    .alliance-legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 2px solid;
    }

    .pool-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #aaa;
    }

    .pool-legend-icon {
      width: 20px;
      height: 20px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
    }

    .pool-legend-icon svg { width: 10px; height: 10px; }

    .tribes-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 50px;
    }

    .tribe {
      border-radius: 16px;
      padding: 30px;
      background: #111;
      border: 1px solid #222;
    }

    .tribe-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid;
    }

    .tribe-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tribe-name-text {
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .tribe-label {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 1px;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 20px;
    }

    .player-card {
      position: relative;
      border-radius: 12px;
      overflow: visible;
      background: #1a1a1a;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: default;
    }

    .player-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .player-card.eliminated { filter: grayscale(1); opacity: 0.5; }
    .player-card.eliminated:hover { transform: none; box-shadow: none; }

    .player-card-inner { border-radius: 12px; overflow: hidden; }

    .player-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      overflow: hidden;
    }

    .player-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .x-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }

    .eliminated .x-overlay { display: flex; }
    .x-overlay svg { width: 70%; height: 70%; }

    .pool-pick {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 28px;
      height: 28px;
      background: #3b82f6;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      border: 2px solid #fff;
    }

    .pool-pick svg { width: 14px; height: 14px; }
    .pool-pick.visible { display: flex; }

    .player-info { padding: 10px; text-align: center; }

    .player-name {
      font-family: 'Oswald', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .player-season { font-size: 0.75rem; color: #777; margin-top: 3px; }

    .elim-tag {
      display: none;
      font-size: 0.7rem;
      font-weight: 600;
      color: #ef4444;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .eliminated .elim-tag { display: block; }

    .badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 0 6px 8px;
    }

    .badge {
      display: none;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 3px 7px;
      border-radius: 4px;
      white-space: nowrap;
      line-height: 1;
    }

    .badge.visible { display: inline-block; }
    .badge-idol { background: #854d0e; color: #fbbf24; border: 1px solid #a16207; }
    .badge-extra-vote { background: #1e3a5f; color: #60a5fa; border: 1px solid #2563eb; }
    .badge-lost-vote { background: #3f0f0f; color: #f87171; border: 1px solid #991b1b; }
    .badge-boomerang { background: #4a1d6a; color: #c084fc; border: 1px solid #7c3aed; }

    .player-card.alliance-highlight {
      outline: 3px solid;
      outline-offset: -1px;
      border-radius: 12px;
    }

    .voted-out-section {
      border-radius: 16px;
      padding: 30px;
      background: #0d0d0d;
      border: 1px solid #1a1a1a;
    }

    .voted-out-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #333;
    }

    .voted-out-header .tribe-dot { background: #555; }

    .voted-out-header .tribe-name-text {
      color: #555;
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .voted-out-grid {
      display: grid;
      gap: 20px;
      max-width: 900px;
    }

    .voted-out-section .player-card {
      filter: grayscale(1);
      opacity: 0.5;
    }

    .voted-out-section .player-card:hover {
      transform: none;
      box-shadow: none;
    }

    .voted-out-section .x-overlay { display: flex; }
    .voted-out-section .elim-tag { display: block; }

    .legend {
      text-align: center;
      padding: 20px;
      color: #555;
      font-size: 0.8rem;
      border-top: 1px solid #1a1a1a;
    }

    @media (max-width: 900px) {
      .players-grid {
        grid-template-columns: repeat(8, minmax(100px, 1fr));
        overflow-x: auto;
      }
      .tribe { padding: 16px; }
      .tribe-name-text { font-size: 1.4rem; }
      .player-info { padding: 8px; }
      .player-name { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Survivor 50</h1>
  <div class="subtitle">In the Hands of the Fans</div>
</header>

<nav class="episode-bar">
  <button class="ep-btn active" data-ep="0">Pre-Game</button>
  <button class="ep-btn" data-ep="1">Episode 1</button>
  <button class="ep-btn" data-ep="2">Episode 2</button>
  <button class="ep-btn" data-ep="3">Episode 3</button>
  <button class="ep-btn" data-ep="4">Episode 4</button>
</nav>

<div class="alliances-legend" id="alliances-legend"></div>

<main class="tribes-container" id="tribes-container"></main>

<footer class="legend">
  Survivor 50: In the Hands of the Fans &mdash; CBS, Spring 2026
</footer>

<script>
  // === PLAYER DATA ===
  const players = {
    joe_hunter:          { name: 'Joe Hunter',             season: 'S48',                    img: 'joe_hunter.jpg',          elimTag: '' },
    savannah_louie:      { name: 'Savannah Louie',         season: 'S49 Winner',             img: 'savannah_louie.jpg',      elimTag: 'Voted Out — Ep. 2' },
    christian_hubicki:   { name: 'Christian Hubicki',      season: 'S37',                    img: 'christian_hubicki.jpg',   elimTag: '' },
    cirie_fields:        { name: 'Cirie Fields',           season: 'S12 / S16 / S20 / S34', img: 'cirie_fields.jpg',        elimTag: '' },
    ozzy_lusth:          { name: 'Ozzy Lusth',             season: 'S13 / S16 / S23 / S34', img: 'ozzy_lusth.jpg',          elimTag: '' },
    emily_flippen:       { name: 'Emily Flippen',          season: 'S45',                    img: 'emily_flippen.jpg',       elimTag: '' },
    rick_devens:         { name: 'Rick Devens',            season: 'S38',                    img: 'rick_devens.jpg',         elimTag: '' },
    jenna_lewis:         { name: 'Jenna Lewis-Dougherty',  season: 'S1 / S8',                img: 'jenna_lewis.jpg',         elimTag: 'Voted Out — Ep. 1' },
    jonathan_young:      { name: 'Jonathan Young',         season: 'S42',                    img: 'jonathan_young.jpg',      elimTag: '' },
    dee_valladares:      { name: 'Dee Valladares',         season: 'S45 Winner',             img: 'dee_valladares.jpg',      elimTag: '' },
    mike_white:          { name: 'Mike White',             season: 'S37',                    img: 'mike_white.jpg',          elimTag: 'Voted Out — Ep. 4' },
    kamilla_karthigesu:  { name: 'Kamilla Karthigesu',     season: 'S48',                    img: 'kamilla_karthigesu.jpg',  elimTag: '' },
    charlie_davis:       { name: 'Charlie Davis',          season: 'S46',                    img: 'charlie_davis.jpg',       elimTag: '' },
    tiffany_ervin:       { name: 'Tiffany Ervin',          season: 'S46',                    img: 'tiffany_ervin.jpg',       elimTag: '' },
    coach_wade:          { name: '"Coach" Wade',           season: 'S18 / S20 / S23',       img: 'coach_wade.jpg',          elimTag: '' },
    chrissy_hofbeck:     { name: 'Chrissy Hofbeck',        season: 'S35',                    img: 'chrissy_hofbeck.jpg',     elimTag: '' },
    colby_donaldson:     { name: 'Colby Donaldson',        season: 'S2 / S8 / S20',         img: 'colby_donaldson.jpg',     elimTag: '' },
    genevieve_mushaluk:  { name: 'Genevieve Mushaluk',     season: 'S47',                    img: 'genevieve_mushaluk.jpg',  elimTag: '' },
    rizo_velovic:        { name: 'Rizo Velovic',           season: 'S49',                    img: 'rizo_velovic.jpg',        elimTag: '' },
    angelina_keeley:     { name: 'Angelina Keeley',        season: 'S37',                    img: 'angelina_keeley.jpg',     elimTag: '' },
    q_burdette:          { name: 'Q Burdette',             season: 'S46',                    img: 'q_burdette.jpg',          elimTag: 'Voted Out — Ep. 3' },
    stephenie_lagrossa:  { name: 'Stephenie LaGrossa',     season: 'S10 / S11 / S20',       img: 'stephenie_lagrossa.jpg',  elimTag: '' },
    kyle_fraser:         { name: 'Kyle Fraser',            season: 'S48 Winner',             img: 'kyle_fraser.jpg',         elimTag: 'Med. Evac — Ep. 1' },
    aubry_bracco:        { name: 'Aubry Bracco',           season: 'S32 / S34 / S38',       img: 'aubry_bracco.jpg',        elimTag: '' },
  };

  // === TRIBE DEFINITIONS (keyed by episode range) ===
  const tribeColors = {
    Cila:  { color: '#f59e0b', label: 'Orange Tribe' },
    Kalo:  { color: '#14b8a6', label: 'Teal Tribe' },
    Vatu:  { color: '#d946ef', label: 'Magenta Tribe' },
  };

  // Tribe rosters by episode. Each key is the first episode that layout applies.
  const tribesByEpisode = {
    0: {
      Cila: ['joe_hunter','savannah_louie','christian_hubicki','cirie_fields','ozzy_lusth','emily_flippen','rick_devens','jenna_lewis'],
      Kalo: ['jonathan_young','dee_valladares','mike_white','kamilla_karthigesu','charlie_davis','tiffany_ervin','coach_wade','chrissy_hofbeck'],
      Vatu: ['colby_donaldson','genevieve_mushaluk','rizo_velovic','angelina_keeley','q_burdette','stephenie_lagrossa','kyle_fraser','aubry_bracco'],
    },
    3: {
      Cila: ['dee_valladares','rizo_velovic','kamilla_karthigesu','rick_devens','cirie_fields','charlie_davis','jonathan_young'],
      Kalo: ['aubry_bracco','colby_donaldson','tiffany_ervin','coach_wade','chrissy_hofbeck','genevieve_mushaluk','joe_hunter'],
      Vatu: ['stephenie_lagrossa','ozzy_lusth','emily_flippen','christian_hubicki','mike_white','angelina_keeley','q_burdette'],
    },
  };

  // === GAME DATA ===
  const eliminations = {
    1: ['jenna_lewis', 'kyle_fraser'],
    2: ['savannah_louie'],
    3: ['q_burdette'],
    4: ['mike_white'],
  };

  const poolPicks = {
    2: 'cirie_fields',
    3: 'angelina_keeley',
    4: 'colby_donaldson',
  };

  const advantages = {
    1: [
      { player: 'cirie_fields', type: 'extra-vote', label: 'Extra Vote' },
      { player: 'colby_donaldson', type: 'lost-vote', label: 'Lost Vote' },
      { player: 'q_burdette', type: 'lost-vote', label: 'Lost Vote' },
    ],
    2: [
      { player: 'cirie_fields', type: 'extra-vote', label: 'Extra Vote' },
      { player: 'aubry_bracco', type: 'boomerang', label: 'Boomerang Idol' },
      { player: 'ozzy_lusth', type: 'boomerang', label: 'Boomerang Idol' },
      { player: 'colby_donaldson', type: 'lost-vote', label: 'Lost Vote' },
      { player: 'q_burdette', type: 'lost-vote', label: 'Lost Vote' },
    ],
    3: [
      { player: 'cirie_fields', type: 'extra-vote', label: 'Extra Vote' },
      { player: 'aubry_bracco', type: 'boomerang', label: 'Boomerang Idol' },
      { player: 'ozzy_lusth', type: 'boomerang', label: 'Boomerang Idol' },
      { player: 'colby_donaldson', type: 'lost-vote', label: 'Lost Vote' },
    ],
    4: [
      { player: 'cirie_fields', type: 'extra-vote', label: 'Extra Vote' },
      { player: 'aubry_bracco', type: 'boomerang', label: 'Boomerang Idol' },
      { player: 'ozzy_lusth', type: 'boomerang', label: 'Boomerang Idol' },
      { player: 'colby_donaldson', type: 'lost-vote', label: 'Lost Vote' },
      { player: 'rizo_velovic', type: 'boomerang', label: 'Boomerang Idol' },
    ],
  };

  const alliances = {
    1: [
      { name: 'Christian & Devens', color: '#f59e0b', members: ['christian_hubicki', 'rick_devens'] },
      { name: 'Ozzy & Cirie', color: '#22d3ee', members: ['ozzy_lusth', 'cirie_fields'] },
      { name: 'Vatu 5', color: '#d946ef', members: ['q_burdette', 'colby_donaldson', 'genevieve_mushaluk', 'rizo_velovic', 'stephenie_lagrossa'] },
    ],
    2: [
      { name: 'Christian & Devens', color: '#f59e0b', members: ['christian_hubicki', 'rick_devens'] },
      { name: 'Ozzy & Cirie', color: '#22d3ee', members: ['ozzy_lusth', 'cirie_fields'] },
      { name: 'Vatu 5', color: '#d946ef', members: ['q_burdette', 'colby_donaldson', 'genevieve_mushaluk', 'rizo_velovic', 'stephenie_lagrossa'] },
    ],
    3: [
      { name: 'Christian & Devens', color: '#f59e0b', members: ['christian_hubicki', 'rick_devens'] },
      { name: 'Ozzy & Cirie', color: '#22d3ee', members: ['ozzy_lusth', 'cirie_fields'] },
      { name: 'Kalo Honor Alliance', color: '#10b981', members: ['coach_wade', 'colby_donaldson', 'joe_hunter', 'chrissy_hofbeck'] },
      { name: 'Dee & Jonathan', color: '#f472b6', members: ['dee_valladares', 'jonathan_young'] },
    ],
    4: [
      { name: 'Christian & Emily & Stephenie', color: '#f59e0b', members: ['christian_hubicki', 'emily_flippen', 'stephenie_lagrossa'] },
      { name: 'Ozzy & Cirie', color: '#22d3ee', members: ['ozzy_lusth', 'cirie_fields'] },
      { name: 'Kalo Honor Alliance', color: '#10b981', members: ['coach_wade', 'colby_donaldson', 'joe_hunter', 'chrissy_hofbeck'] },
      { name: 'Dee & Jonathan', color: '#f472b6', members: ['dee_valladares', 'jonathan_young'] },
    ],
  };

  // === RENDERING ===

  const xSvg = `<svg viewBox="0 0 100 100"><line x1="15" y1="15" x2="85" y2="85" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/><line x1="85" y1="15" x2="15" y2="85" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/></svg>`;
  const poolSvg = `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="white"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="white"/></svg>`;

  function buildCard(id) {
    const p = players[id];
    return `<div class="player-card" data-player="${id}">
      <div class="pool-pick">${poolSvg}</div>
      <div class="player-card-inner">
        <div class="player-img-wrap">
          <img src="images/${p.img}" alt="${p.name}" loading="lazy">
          <div class="x-overlay">${xSvg}</div>
        </div>
        <div class="player-info">
          <div class="player-name">${p.name}</div>
          <div class="player-season">${p.season}</div>
          <div class="elim-tag">${p.elimTag}</div>
        </div>
        <div class="badges"></div>
      </div>
    </div>`;
  }

  function buildTribe(tribeName, memberIds) {
    const tc = tribeColors[tribeName];
    const cols = Math.max(memberIds.length, 1);
    return `<section class="tribe">
      <div class="tribe-header" style="border-color:${tc.color}">
        <div class="tribe-dot" style="background:${tc.color}"></div>
        <div>
          <div class="tribe-name-text" style="color:${tc.color}">${tribeName}</div>
          <div class="tribe-label">${tc.label}</div>
        </div>
      </div>
      <div class="players-grid" style="grid-template-columns:repeat(${cols},1fr)">
        ${memberIds.map(id => buildCard(id)).join('')}
      </div>
    </section>`;
  }

  const container = document.getElementById('tribes-container');
  const legendEl = document.getElementById('alliances-legend');
  const buttons = document.querySelectorAll('.ep-btn');

  function getTribesForEp(ep) {
    let tribes = tribesByEpisode[0];
    for (const key of Object.keys(tribesByEpisode).map(Number).sort((a,b) => a-b)) {
      if (key <= ep) tribes = tribesByEpisode[key];
    }
    return tribes;
  }

  function setEpisode(ep) {
    buttons.forEach(b => b.classList.toggle('active', parseInt(b.dataset.ep) === ep));

    // Build eliminated set
    const eliminatedSet = new Set();
    for (let e = 1; e <= ep; e++) {
      if (eliminations[e]) eliminations[e].forEach(p => eliminatedSet.add(p));
    }

    // Pool picks
    const poolSet = new Set();
    for (let e = 1; e <= ep; e++) {
      if (poolPicks[e]) poolSet.add(poolPicks[e]);
    }

    // Advantages
    let currentAdvantages = [];
    for (let e = ep; e >= 1; e--) {
      if (advantages[e]) { currentAdvantages = advantages[e]; break; }
    }
    const advMap = {};
    currentAdvantages.forEach(a => {
      if (!advMap[a.player]) advMap[a.player] = [];
      advMap[a.player].push(a);
    });

    // Alliances
    let currentAlliances = [];
    for (let e = ep; e >= 1; e--) {
      if (alliances[e]) { currentAlliances = alliances[e]; break; }
    }
    const allianceMap = {};
    currentAlliances.forEach(a => {
      a.members.forEach(m => {
        if (!allianceMap[m]) allianceMap[m] = [];
        allianceMap[m].push(a);
      });
    });

    // Render tribes
    const tribes = getTribesForEp(ep);
    const allTribeMembers = new Set(Object.values(tribes).flat());
    const votedOutList = [];
    for (let e = 1; e <= ep; e++) {
      if (eliminations[e]) {
        eliminations[e].forEach(id => {
          if (!allTribeMembers.has(id)) votedOutList.push(id);
        });
      }
    }

    let html = Object.entries(tribes).map(([name, members]) => buildTribe(name, members)).join('');

    if (votedOutList.length > 0) {
      const cols = Math.max(votedOutList.length, 1);
      html += `<section class="voted-out-section">
        <div class="voted-out-header">
          <div class="tribe-dot"></div>
          <div>
            <div class="tribe-name-text">Voted Out</div>
          </div>
        </div>
        <div class="voted-out-grid" style="grid-template-columns:repeat(${cols},1fr)">
          ${votedOutList.map(id => buildCard(id)).join('')}
        </div>
      </section>`;
    }

    container.innerHTML = html;

    // Apply state to cards
    container.querySelectorAll('.player-card').forEach(card => {
      const id = card.dataset.player;

      if (eliminatedSet.has(id)) card.classList.add('eliminated');

      const poolIcon = card.querySelector('.pool-pick');
      if (poolSet.has(id) && ep > 0) poolIcon.classList.add('visible');

      const badgesEl = card.querySelector('.badges');
      if (ep > 0 && advMap[id] && !eliminatedSet.has(id)) {
        advMap[id].forEach(adv => {
          const badge = document.createElement('span');
          badge.className = `badge badge-${adv.type} visible`;
          badge.textContent = adv.label;
          badgesEl.appendChild(badge);
        });
      }

      card.classList.remove('alliance-highlight');
      card.style.outlineColor = '';
      if (ep > 0 && allianceMap[id] && !eliminatedSet.has(id)) {
        card.classList.add('alliance-highlight');
        card.style.outlineColor = allianceMap[id][0].color;
      }
    });

    // Legend
    legendEl.innerHTML = '';
    if (ep > 0 && (currentAlliances.length > 0 || poolSet.size > 0)) {
      legendEl.classList.add('visible');
      if (poolSet.size > 0) {
        const item = document.createElement('div');
        item.className = 'pool-legend';
        item.innerHTML = `<div class="pool-legend-icon"><svg viewBox="0 0 24 24" fill="none" width="10" height="10"><circle cx="12" cy="8" r="4" fill="white"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="white"/></svg></div> My Pool Pick`;
        legendEl.appendChild(item);
      }
      currentAlliances.forEach(a => {
        const item = document.createElement('div');
        item.className = 'alliance-legend-item';
        item.innerHTML = `<div class="alliance-legend-swatch" style="background:${a.color}33;border-color:${a.color}"></div> ${a.name}`;
        legendEl.appendChild(item);
      });
    } else {
      legendEl.classList.remove('visible');
    }
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => setEpisode(parseInt(btn.dataset.ep)));
  });

  const maxEp = Math.max(...Array.from(buttons).map(b => parseInt(b.dataset.ep)));
  setEpisode(maxEp);
</script>

</body>
</html>
