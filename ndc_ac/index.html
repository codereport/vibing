<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>Algorithms &amp; Combinators</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    background: #000;
  }

  .slide {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#mystify {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .title-content {
    position: relative;
    z-index: 1;
    text-align: center;
    pointer-events: none;
  }

  .title-content h1 {
    font-size: clamp(2.5rem, 6vw, 5.5rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-shadow: 0 0 40px rgba(0,0,0,0.95), 0 0 80px rgba(0,0,0,0.8);
  }

  .title-content .ampersand {
    color: #7b2ff2;
  }

  .title-content .author {
    margin-top: 1.5rem;
    font-size: clamp(1.1rem, 2.2vw, 2rem);
    font-weight: 400;
    color: #ccc;
    letter-spacing: 0.04em;
    text-shadow: 0 0 30px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<div class="slide">
  <canvas id="mystify"></canvas>
  <div class="title-content">
    <h1>Algorithms <span class="ampersand">&amp;</span> Combinators</h1>
    <p class="author">Conor Hoekstra</p>
  </div>
</div>

<script>
const canvas = document.getElementById('mystify');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

const RIBBON_COUNT = 3;
const POINTS_PER_RIBBON = 5;
const TRAIL_LENGTH = 40;

const PURPLES = [
  { r: 123, g: 47, b: 242 },
];

class Point {
  constructor() {
    this.x = Math.random() * W();
    this.y = Math.random() * H();
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 1.8;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    if (this.x <= 0 || this.x >= W()) {
      this.vx *= -1;
      this.x = Math.max(0, Math.min(W(), this.x));
    }
    if (this.y <= 0 || this.y >= H()) {
      this.vy *= -1;
      this.y = Math.max(0, Math.min(H(), this.y));
    }
  }
}

class Ribbon {
  constructor(colorIdx) {
    this.points = Array.from({ length: POINTS_PER_RIBBON }, () => new Point());
    this.trail = [];
    this.color = PURPLES[colorIdx % PURPLES.length];
  }

  update() {
    for (const p of this.points) p.update();
    this.trail.push(this.points.map(p => ({ x: p.x, y: p.y })));
    if (this.trail.length > TRAIL_LENGTH) this.trail.shift();
  }

  draw() {
    for (let t = 0; t < this.trail.length; t++) {
      const positions = this.trail[t];
      const alpha = (t / this.trail.length) * 0.55;
      const { r, g, b } = this.color;

      ctx.beginPath();
      ctx.moveTo(positions[0].x, positions[0].y);
      for (let i = 1; i < positions.length; i++) {
        ctx.lineTo(positions[i].x, positions[i].y);
      }
      ctx.closePath();
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }
}

const ribbons = Array.from({ length: RIBBON_COUNT }, (_, i) => new Ribbon(i));

function animate() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.92)';
  ctx.fillRect(0, 0, W(), H());

  for (const ribbon of ribbons) {
    ribbon.update();
    ribbon.draw();
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
