<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combinator Graphic - Algorithms &amp; Combinators</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
  }
  iframe.interactive { pointer-events: auto; height: calc(100% - 12px); }
</style>
</head>
<body>
<iframe src="https://combinatorylogic.com/graphic.html" title="Combinator Graphic"></iframe>
<script>
const iframe = document.querySelector('iframe');

document.addEventListener('keydown', (e) => {
  if (e.key === 'e' || e.key === 'E') {
    iframe.classList.add('interactive');
    iframe.focus();
  }
});

document.addEventListener('click', (e) => {
  if (e.target !== iframe) {
    iframe.classList.remove('interactive');
    window.focus();
  }
});
</script>
<script src="nav.js"></script>
</body>
</html>
