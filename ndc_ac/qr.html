<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>QR Code - Algorithms &amp; Combinators</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #000;
    overflow: hidden;
  }
  .slide {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
  }
  .slide img {
    max-height: 70vh;
    max-width: 70vw;
    object-fit: contain;
    border-radius: 12px;
  }
  .slide p {
    color: #aaa;
    font-size: clamp(1rem, 2vw, 1.6rem);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="slide">
  <img src="assets/qr_linktree.png" alt="QR Code">
</div>
<script src="nav.js"></script>
</body>
</html>
