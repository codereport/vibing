<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Linux+Libertine&display=swap" rel="stylesheet">
<style>@import url('https://fonts.cdnfonts.com/css/linux-libertine');</style>
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>Thank You - Algorithms &amp; Combinators</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Linux Libertine', 'Linux Libertine G', 'Linux Libertine O', Georgia, serif;
    background: #000;
    overflow: hidden;
  }
  canvas#warp {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .content {
    position: relative;
    z-index: 1;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(3rem, 7vw, 6rem);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 40px rgba(0,0,0,0.95), 0 0 80px rgba(0,0,0,0.8);
  }
  img {
    max-height: 35vh;
    max-width: 35vw;
    object-fit: contain;
  }
</style>
</head>
<body>
<canvas id="warp"></canvas>
<div class="content">
  <h1>Thank You</h1>
  <img src="assets/qr_cropped.png" alt="QR Code">
</div>
<script src="starfield-bg.js"></script>
<script src="nav.js"></script>
</body>
</html>
