<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>Copy Family - Algorithms &amp; Combinators</title>
<link href="https://fonts.googleapis.com/css2?family=Linux+Libertine&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.cdnfonts.com/css/linux-libertine');

  @font-face {
    font-family: 'TinyAPL';
    src: url('https://raw.githubusercontent.com/codereport/hoogle-translate/main/public/fonts/TinyAPL386.ttf') format('truetype');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Linux Libertine', 'Linux Libertine G', 'Linux Libertine O', Georgia, serif;
    background: #000;
    color: #fff;
    overflow: hidden;
  }
  .slide {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
  }
  h1 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  table {
    border-collapse: collapse;
    font-size: clamp(1.4rem, 2.5vw, 2.2rem);
  }
  td {
    padding: 0.6em 1.5em;
    text-align: center;
  }
  td:first-child {
    color: #aaa;
  }
  th {
    padding: 0.6em 1.5em;
    text-align: center;
    font-weight: 700;
    color: #ccc;
  }
  th img {
    height: 1.6em;
    vertical-align: middle;
  }
  .tapl {
    font-family: 'TinyAPL', monospace;
  }
  .mono {
    font-family: 'JetBrains Mono', monospace;
  }
  sub {
    font-size: 0.65em;
    color: #999;
  }
</style>
</head>
<body>
<div class="slide">
  <h1>Copy Family</h1>
  <table>
    <tr><th></th><th>Name</th><th><img src="https://raw.githubusercontent.com/codereport/logos/main/tinyapl.svg" alt="TinyAPL"></th><th>Combinator</th></tr>
    <tr><td>Unary</td><td class="mono">filter<br>copy_if</td><td class="tapl">_{ ⍵⌿⍨⍶⍶⍵ }<br>_{ ⍶⍶⍛⌿⍵ }</td><td>C<br>Σ</td></tr>
    <tr><td>Binary</td><td class="mono">adjacentFilter<br>unique</td><td class="tapl">_{ ⍵⌿⍨1⍪~⍶⍶⌺⍵ }</td><td>C</td></tr>
    <tr><td>Integer</td><td class="mono">repeat</td><td class="tapl">⌿</td><td></td></tr>
    <tr><td>Mask<sub>Boolean</sub></td><td class="mono">compress</td><td class="tapl">⌿</td><td></td></tr>
    <tr><td>Mask<sub>Integer</sub></td><td class="mono">replicate</td><td class="tapl">⌿</td><td></td></tr>
  </table>
</div>
<script src="nav.js"></script>
</body>
</html>
