<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>Map Family - Algorithms &amp; Combinators</title>
<link href="https://fonts.googleapis.com/css2?family=Linux+Libertine&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.cdnfonts.com/css/linux-libertine');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Linux Libertine', 'Linux Libertine G', 'Linux Libertine O', Georgia, serif;
    background: #000;
    color: #fff;
    overflow: hidden;
  }
  .slide {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
  }
  h1 {
    font-size: clamp(2.5rem, 5vw, 4.5rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  table {
    border-collapse: collapse;
    font-size: clamp(1.4rem, 2.5vw, 2.2rem);
  }
  td {
    padding: 0.6em 1.5em;
    text-align: center;
  }
  td:first-child {
    color: #aaa;
  }
  th {
    padding: 0.6em 1.5em;
    text-align: center;
    font-weight: 700;
    color: #ccc;
  }
  .mono {
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>
<div class="slide">
  <h1>Map Family</h1>
  <table>
    <tr><th></th><th>Name</th></tr>
    <tr><td>Unary</td><td class="mono">map</td></tr>
    <tr><td>Binary</td><td class="mono">map2<br>adjacentMap</td></tr>
  </table>
</div>
<script src="nav.js"></script>
