<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Poll - Algorithms &amp; Combinators</title>
<link rel="prefetch" href="https://hoogletranslate.com/?q=9&type=by-algo-id&expr=false&libs=false">
<style>.preload-iframe { position: absolute; width: 0; height: 0; border: none; opacity: 0; pointer-events: none; }</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #000;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .header {
    text-align: center;
    padding: 24px 20px 8px;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    font-weight: 700;
  }
  .header .voters {
    font-size: 0.95rem;
    color: #888;
    margin-top: 4px;
  }
  .chart-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 10px 20px 20px;
    gap: 40px;
  }
  canvas {
    max-height: 80vh;
  }
  .legend {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .legend-item {
    display: none;
    align-items: center;
    gap: 10px;
  }
  .legend-item.visible { display: flex; }
  .legend-swatch {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .legend-logo {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }
  .legend-name {
    font-size: 1rem;
    color: #ccc;
    white-space: nowrap;
  }
  .legend-count {
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    margin-left: auto;
    min-width: 30px;
    text-align: right;
  }
  #status {
    position: fixed;
    bottom: 12px;
    right: 16px;
    font-size: 0.7rem;
    color: #444;
  }
  #status.connected { color: #4a4; }
  #status.disconnected { color: #a44; }
</style>
</head>
<body>
<div class="header">
  <h1>What languages do you code in?</h1>
  <div class="voters" id="voters"></div>
</div>
<div class="chart-wrap">
  <canvas id="pie"></canvas>
  <div class="legend" id="legend"></div>
</div>
<div id="status">Connecting...</div>

<script>
const LOGO_BASE = 'https://raw.githubusercontent.com/codereport/logos/main/';

const LOGO_MAP = {
  'Python': 'python.png',
  'JavaScript': 'javascript.png',
  'TypeScript': 'ts.png',
  'Java': 'java.png',
  'C++': 'cpp.png',
  'C': 'c.png',
  'C#': 'csharp.png',
  'Go': 'go.png',
  'Rust': 'rust_darkmode.png',
  'Kotlin': 'kotlin.svg',
  'Swift': 'swift.png',
  'Ruby': 'ruby.png',
  'PHP': 'php.png',
  'Scala': 'scala.svg',
  'Haskell': 'haskell.svg',
  'R': 'r.png',
  'MATLAB': 'matlab.png',
  'APL': 'apl.png',
  'BQN': 'bqn.svg',
};

const canvas = document.getElementById('pie');
const ctx = canvas.getContext('2d');
const legendEl = document.getElementById('legend');
const votersEl = document.getElementById('voters');
const statusEl = document.getElementById('status');

let globalHue = 270;
let targetSlices = [];
let animatedFractions = {};
let legendItems = {};

function resize() {
  const size = Math.min(window.innerHeight * 0.7, window.innerWidth * 0.4, 500);
  canvas.width = size * devicePixelRatio;
  canvas.height = size * devicePixelRatio;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function ensureLegendItem(lang, color) {
  if (legendItems[lang]) return legendItems[lang];

  const item = document.createElement('div');
  item.className = 'legend-item';

  const swatch = document.createElement('div');
  swatch.className = 'legend-swatch';
  item.appendChild(swatch);

  const logo = LOGO_MAP[lang];
  if (logo) {
    const img = document.createElement('img');
    img.className = 'legend-logo';
    img.src = LOGO_BASE + logo;
    img.alt = lang;
    item.appendChild(img);
  }

  const name = document.createElement('span');
  name.className = 'legend-name';
  name.textContent = lang;
  item.appendChild(name);

  const count = document.createElement('span');
  count.className = 'legend-count';
  count.textContent = '0';
  item.appendChild(count);

  legendEl.appendChild(item);
  legendItems[lang] = { el: item, swatch, count };
  return legendItems[lang];
}

function updateChart(tallies) {
  const sorted = Object.entries(tallies)
    .map(([lang, votes]) => ({ lang, votes }))
    .filter(e => e.votes > 0)
    .sort((a, b) => b.votes - a.votes);

  const totalVotes = sorted.reduce((s, e) => s + e.votes, 0);
  votersEl.textContent = totalVotes > 0 ? `${totalVotes} votes` : 'Waiting for votes...';

  targetSlices = sorted.map(({ lang, votes }, i) => ({
    lang,
    votes,
    fraction: totalVotes > 0 ? votes / totalVotes : 0,
    hue: (globalHue + i * (360 / Math.max(sorted.length, 1))) % 360,
  }));

  for (const [lang, item] of Object.entries(legendItems)) {
    const entry = sorted.find(s => s.lang === lang);
    if (entry) {
      item.el.classList.add('visible');
      item.count.textContent = entry.votes;
    } else {
      item.el.classList.remove('visible');
    }
  }

  targetSlices.forEach(({ lang, votes, hue }) => {
    const color = `hsl(${hue}, 70%, 55%)`;
    const item = ensureLegendItem(lang, color);
    item.swatch.style.background = color;
    item.count.textContent = votes;
    item.el.classList.add('visible');
    item.el.style.order = targetSlices.findIndex(s => s.lang === lang);
  });
}

function lerp(a, b, t) { return a + (b - a) * t; }

function drawPie() {
  requestAnimationFrame(drawPie);
  globalHue = (globalHue + 0.1) % 360;

  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  const cx = w / 2;
  const cy = h / 2;
  const r = Math.min(cx, cy) - 8;

  ctx.clearRect(0, 0, w, h);

  if (targetSlices.length === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fill();
    ctx.fillStyle = '#444';
    ctx.font = '1.1rem "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Waiting for votes...', cx, cy);
    return;
  }

  let startAngle = -Math.PI / 2;
  for (let i = 0; i < targetSlices.length; i++) {
    const s = targetSlices[i];
    if (!(s.lang in animatedFractions)) animatedFractions[s.lang] = 0;
    animatedFractions[s.lang] = lerp(animatedFractions[s.lang], s.fraction, 0.08);

    const curFrac = animatedFractions[s.lang];
    const hue = (globalHue + i * (360 / targetSlices.length)) % 360;
    const color = `hsl(${hue}, 70%, 55%)`;
    const sweep = curFrac * Math.PI * 2;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, startAngle + sweep);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, startAngle, startAngle + sweep);
    ctx.closePath();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (curFrac > 0.05) {
      const midAngle = startAngle + sweep / 2;
      const tx = cx + Math.cos(midAngle) * r * 0.6;
      const ty = cy + Math.sin(midAngle) * r * 0.6;
      const pct = Math.round(curFrac * 100);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 1rem "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = 4;
      ctx.fillText(`${pct}%`, tx, ty);
      ctx.shadowBlur = 0;
    }

    if (legendItems[s.lang]) {
      legendItems[s.lang].swatch.style.background = color;
    }

    startAngle += sweep;
  }
}

const WS_HOST = location.host || 'localhost:3001';
let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${WS_HOST}`);

  ws.onopen = () => {
    statusEl.textContent = 'Connected';
    statusEl.className = 'connected';
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'tallies') updateChart(msg.data);
  };

  ws.onclose = () => {
    statusEl.textContent = 'Disconnected';
    statusEl.className = 'disconnected';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();
}

connect();
drawPie();
</script>
<script src="nav.js"></script>
<iframe class="preload-iframe" src="https://hoogletranslate.com/?q=9&type=by-algo-id&expr=false&libs=false" tabindex="-1" aria-hidden="true"></iframe>
</body>
</html>
