<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>A Tour - Algorithms &amp; Combinators</title>
<link href="https://fonts.googleapis.com/css2?family=Linux+Libertine&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.cdnfonts.com/css/linux-libertine');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Linux Libertine', 'Linux Libertine G', 'Linux Libertine O', Georgia, serif;
    background: #000;
    overflow: hidden;
  }
  .slide {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3rem;
  }
  .slide h1 {
    font-weight: 700;
    color: #fff;
    text-align: center;
    line-height: 1.3;
    padding: 0 2rem;
  }
  .slide h1 .main-line {
    font-size: clamp(2rem, 4.5vw, 4rem);
  }
  .slide h1 .sub-line {
    font-size: clamp(1.4rem, 3vw, 2.6rem);
  }
  .embeds {
    display: flex;
    gap: 1rem;
    width: 90vw;
    flex: 1;
    max-height: 60vh;
    padding-bottom: 1rem;
  }
  .iframe-wrap {
    flex: 1;
    overflow: hidden;
    border-radius: 8px;
    position: relative;
  }
  .iframe-wrap iframe {
    border: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 158.73%;
    height: 158.73%;
    transform: scale(0.63);
    transform-origin: top left;
  }
  .labels {
    display: flex;
    width: 90vw;
    gap: 1rem;
  }
  .labels span {
    flex: 1;
    text-align: center;
    color: #fff;
    font-size: clamp(1.2rem, 2.2vw, 1.8rem);
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
<div class="slide">
  <h1><span class="sub-line">A Tour of My</span><br><span class="main-line">Algorithm &amp; Combinator</span><br><span class="sub-line">Mental Model</span></h1>
  <div class="embeds">
    <div class="iframe-wrap"><iframe src="https://hoogletranslate.com/?q=9&type=by-algo-id&expr=false&libs=false" title="Hoogle Translate"></iframe></div>
    <div class="iframe-wrap"><iframe src="https://combinatorylogic.com/graphic.html" title="Combinator Graphic"></iframe></div>
  </div>
  <div class="labels">
    <span>hoogletranslate.com</span>
    <span>combinatorylogic.com</span>
  </div>
</div>
<script src="nav.js"></script>
</body>
</html>
