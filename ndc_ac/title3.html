<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>Algorithms &amp; Combinators</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    background: #000;
  }

  .slide {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#warp {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .title-content {
    position: relative;
    z-index: 1;
    text-align: center;
    pointer-events: none;
  }

  .title-content h1 {
    font-size: clamp(2.5rem, 6vw, 5.5rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-shadow: 0 0 40px rgba(0,0,0,0.95), 0 0 80px rgba(0,0,0,0.8);
  }

  .title-content .ampersand {
    color: #fff;
  }

  .title-content .author {
    margin-top: 1.5rem;
    font-size: clamp(1.1rem, 2.2vw, 2rem);
    font-weight: 400;
    color: #ccc;
    letter-spacing: 0.04em;
    text-shadow: 0 0 30px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<div class="slide">
  <canvas id="warp"></canvas>
  <div class="title-content">
    <h1>Algorithms <span class="ampersand">&amp;</span> Combinators</h1>
    <p class="author">Conor Hoekstra</p>
  </div>
</div>

<script>
const LOGO_BASE = 'https://raw.githubusercontent.com/codereport/logos/main/';
const LOGO_FILES = [
  'python.png', 'haskell.svg', 'cpp.png', 'rust_darkmode.png',
  'java.png', 'javascript.png', 'go.png', 'scala.svg',
  'kotlin.svg', 'ruby.png', 'elixir.png', 'clojure.png',
  'swift.png', 'julia_darkmode.png', 'apl.png', 'bqn.svg',
  'fsharp.png', 'csharp.png', 'd.png', 'r.png',
  'uiua.png', 'j.svg', 'tinyapl.svg',
];

const logos = [];
LOGO_FILES.forEach(f => {
  const img = new Image();
  img.src = LOGO_BASE + f;
  logos.push(img);
});

const canvas = document.getElementById('warp');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const W = () => window.innerWidth;
const H = () => window.innerHeight;

const STAR_COUNT = 50;
const MAX_Z = 15;
const MIN_Z = 0.2;
const SPEED = 5;
const BASE_SIZE = 70;
const SPREAD = 600;
const stars = [];

function makeStar(stagger) {
  return {
    x: (Math.random() - 0.5) * SPREAD,
    y: (Math.random() - 0.5) * SPREAD,
    z: stagger ? MIN_Z + Math.random() * (MAX_Z - MIN_Z) : MAX_Z - Math.random() * 2,
    logo: logos[Math.floor(Math.random() * logos.length)],
  };
}

for (let i = 0; i < STAR_COUNT; i++) stars.push(makeStar(true));

let lastTime = performance.now();

function animate(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  const cx = W() / 2;
  const cy = H() / 2;

  ctx.clearRect(0, 0, W(), H());

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.z -= SPEED * dt;

    if (s.z <= MIN_Z) {
      stars[i] = makeStar(false);
      continue;
    }

    if (!s.logo.complete || !s.logo.naturalWidth) continue;

    const scale = 1 / s.z;
    const sx = cx + s.x * scale;
    const sy = cy + s.y * scale;
    const size = BASE_SIZE * scale;

    if (sx + size < 0 || sx - size > W() || sy + size < 0 || sy - size > H()) {
      stars[i] = makeStar(false);
      continue;
    }

    const t = 1 - (s.z - MIN_Z) / (MAX_Z - MIN_Z);
    const opacity = 0.1 + t * 0.55;

    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.drawImage(s.logo, sx - size / 2, sy - size / 2, size, size);
    ctx.restore();
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
<script>
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') window.location.href = 'title2.html';
  if (e.key === 'ArrowRight' || e.key === 'PageDown') window.location.href = 'qr.html';
});
let tsy = 0;
document.addEventListener('touchstart', (e) => { tsy = e.changedTouches[0].screenY; }, { passive: true });
document.addEventListener('touchend', (e) => {
  const dy = e.changedTouches[0].screenY - tsy;
  if (Math.abs(dy) > 50 && dy > 0) window.location.href = 'title2.html';
}, { passive: true });
</script>
<script src="nav.js"></script>
</body>
</html>
