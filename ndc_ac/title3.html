<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
<title>Algorithms &amp; Combinators</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    background: #000;
  }

  .slide {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas#warp {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .title-content {
    position: relative;
    z-index: 1;
    text-align: center;
    pointer-events: none;
  }

  .title-content h1 {
    font-size: clamp(2.5rem, 6vw, 5.5rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-shadow: 0 0 40px rgba(0,0,0,0.95), 0 0 80px rgba(0,0,0,0.8);
  }

  .title-content .ampersand {
    color: #fff;
  }

  .title-content .author {
    margin-top: 1.5rem;
    font-size: clamp(1.1rem, 2.2vw, 2rem);
    font-weight: 400;
    color: #ccc;
    letter-spacing: 0.04em;
    text-shadow: 0 0 30px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>
<div class="slide">
  <canvas id="warp"></canvas>
  <div class="title-content">
    <h1>Algorithms <span class="ampersand">&amp;</span> Combinators</h1>
    <p class="author">Conor Hoekstra</p>
  </div>
</div>

<script src="starfield-bg.js"></script>
<script>
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') window.location.href = 'title2.html';
  if (e.key === 'ArrowRight' || e.key === 'PageDown') window.location.href = 'qr.html';
});
let tsy = 0;
document.addEventListener('touchstart', (e) => { tsy = e.changedTouches[0].screenY; }, { passive: true });
document.addEventListener('touchend', (e) => {
  const dy = e.changedTouches[0].screenY - tsy;
  if (Math.abs(dy) > 50 && dy > 0) window.location.href = 'title2.html';
}, { passive: true });
</script>
<script src="nav.js"></script>
</body>
</html>
