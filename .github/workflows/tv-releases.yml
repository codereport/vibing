name: Update TV premieres

on:
  schedule:
    - cron: '17 12 * * 1' # Mondays at 12:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tv/shows.json
      - tv/scripts/update_releases.py
      - .github/workflows/tv-releases.yml

permissions:
  contents: read

concurrency:
  group: tv-release-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check updater behavior
        run: python -m unittest discover -s tv/tests -p 'test_*.py'
      - name: Refresh release dates
        id: refresh
        continue-on-error: true
        run: python tv/scripts/update_releases.py
      - name: Commit the snapshot
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add tv/releases.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update TV season premiere dates'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Bot pushes don't trigger the repository's branch-based Pages build.
      # Request it explicitly so the published dates actually update each week.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'
      - name: Report incomplete checks
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Some shows could not be refreshed. Successful updates and previous dates were saved. See the refresh log.'
          exit 1
