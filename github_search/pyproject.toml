[project]
name = "github-thrust-search"
version = "1.0.0"
description = "Search and rank GitHub repositories by Nvidia Thrust library usage"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "httpx>=0.25.2",
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "aiofiles>=23.2.1",
    "beautifulsoup4>=4.12.2",
    "PyGithub>=1.59.1",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.2",
    "flask>=3.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Since this is a script-based project, we don't install it as a package
# This tells hatch to skip trying to find package directories
bypass-selection = true
exclude = ["*"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
