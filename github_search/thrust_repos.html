<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thrust Repositories - Star Ranking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #667eea;
            color: white;
        }

        .stats {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .repo-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 4px solid #667eea;
        }

        .repo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }

        .repo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .repo-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            text-decoration: none;
            flex: 1;
        }

        .repo-name:hover {
            color: #667eea;
        }

        .star-count {
            background: #f8f9fa;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .star-icon {
            color: #ffa500;
        }

        .repo-description {
            color: #666;
            line-height: 1.4;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .repo-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.85rem;
            color: #888;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .language-badge {
            background: #e7f3ff;
            color: #0066cc;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        .topic-tag {
            background: #f0f0f0;
            color: #666;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 0.75rem;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }

        .error {
            background: #ffe6e6;
            color: #cc0000;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }

        .rank-badge {
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Thrust analysis section styles */
        .thrust-analysis {
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            color: white;
        }

        .thrust-header {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .thrust-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 4px;
        }

        .thrust-stat {
            text-align: center;
            flex: 1;
        }

        .thrust-count {
            display: block;
            font-weight: bold;
            font-size: 1.1rem;
            color: white;
        }

        .thrust-label {
            display: block;
            font-size: 0.7rem;
            opacity: 0.9;
            margin-top: 2px;
        }

        @media (max-width: 768px) {
            .repo-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .search-box {
                min-width: 100%;
            }
            
            .dataset-selector {
                margin: 10px 0;
            }
            
            .stats {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Thrust Repositories</h1>
            <p>Discover GitHub repositories using NVIDIA Thrust, ranked by stars</p>
            <p id="datasetInfo" style="font-size: 0.9rem; opacity: 0.8; margin-top: 8px;">
                📊 2,195 repositories
            </p>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search repositories by name, description, or language...">
            </div>
            <div class="dataset-selector">
                <label for="datasetSelect" style="margin-right: 10px; font-weight: 600; color: #667eea;">Dataset:</label>
                <select id="datasetSelect" style="padding: 8px 12px; border: 2px solid #667eea; border-radius: 6px; background: white; color: #667eea; font-size: 14px; cursor: pointer;">
                    <option value="thrust">thrust (3,142 repos - Aug 19, 2025)</option>
                    <option value="thrust-namespace" selected>thrust:: (2,195 repos)</option>
                </select>
            </div>
            <div class="ranking-selector">
                <label for="rankingSelect" style="margin-right: 10px; font-weight: 600; color: #ff7e5f;">Rank by:</label>
                <select id="rankingSelect" style="padding: 8px 12px; border: 2px solid #ff7e5f; border-radius: 6px; background: white; color: #ff7e5f; font-size: 14px; cursor: pointer;">
                    <option value="stars" selected>⭐ GitHub Stars</option>
                    <option value="thrust-patterns">🔥 Thrust :: Patterns</option>
                    <option value="files-with-thrust">📁 Files with Thrust</option>
                    <option value="coverage">📈 Thrust Coverage %</option>
                    <option value="recent-commit">📅 Most Recent Commit</option>
                </select>
            </div>
            <div class="filter-controls">
                <button class="filter-btn" data-filter="all">All Repos</button>
                <button class="filter-btn" data-filter="1000+">1000+ Stars</button>
                <button class="filter-btn active" data-filter="100+">100+ Stars</button>
                <button class="filter-btn" data-filter="recent">Recently Updated</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalRepos">-</div>
                <div class="stat-label">Total Repositories</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="totalStars">-</div>
                <div class="stat-label">Total Stars</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="averageStars">-</div>
                <div class="stat-label">Average Stars</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="displayedRepos">-</div>
                <div class="stat-label">Displayed</div>
            </div>
        </div>

        <div id="loading" class="loading">
            <p>🔄 Loading repository data...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p>❌ Error loading repository data. Please make sure the data file is available.</p>
        </div>

        <div id="repoGrid" class="repo-grid" style="display: none;">
            <!-- Repository cards will be inserted here -->
        </div>
    </div>

    <script>
        let allRepos = [];
        let filteredRepos = [];
        let currentFilter = '100+';
        let currentDataset = 'thrust-namespace';
        let currentRanking = 'stars';

        // Data file mapping
        const dataFiles = {
            'thrust': 'data/thrust_repos_with_stars_20250819_161159.json',
            'thrust-namespace': 'data/thrust_namespace_with_accurate_dates_20250904_121738.json'
        };

        // Thrust analysis data
        let thrustAnalysisData = {};

        // Load thrust analysis data
        async function loadThrustAnalysis() {
            try {
                // Find the latest thrust analysis file
                const response = await fetch('data/thrust_analysis_local_clone_20250904_132356.json');
                if (response.ok) {
                    const analysisData = await response.json();
                    
                    // Create lookup map by repository full name
                    thrustAnalysisData = {};
                    for (const repo of analysisData.repositories || []) {
                        const fullName = repo.repo_name;
                        const totalThrust = Object.values(repo.thrust_by_extension || {}).reduce((a, b) => a + b, 0);
                        const totalApis = Object.values(repo.api_by_extension || {}).reduce((a, b) => a + b, 0);
                        
                        // Get files with thrust and calculate percentage
                        const filesWithThrust = repo.files_with_thrust_count || 0;
                        const filesAnalyzed = repo.files_analyzed || 0;
                        const thrustPercentage = filesAnalyzed > 0 ? (filesWithThrust / filesAnalyzed * 100) : 0;
                        
                        thrustAnalysisData[fullName] = {
                            total_thrust_patterns: totalThrust,
                            total_api_calls: totalApis,
                            files_with_thrust: filesWithThrust,
                            thrust_percentage: thrustPercentage,
                            files_analyzed: filesAnalyzed, // Keep for calculation but don't display
                            clone_size_mb: repo.clone_size_mb,
                            thrust_by_extension: repo.thrust_by_extension || {},
                            api_by_extension: repo.api_by_extension || {}
                        };
                    }
                    console.log(`🎯 Loaded thrust analysis for ${Object.keys(thrustAnalysisData).length} repositories`);
                }
            } catch (error) {
                console.warn('Could not load thrust analysis data:', error);
            }
        }

        // Load repository data based on selected dataset
        async function loadRepoData(dataset = 'thrust') {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('repoGrid').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                
                // Load both repository data and thrust analysis
                const [repoResponse] = await Promise.all([
                    fetch(dataFiles[dataset]),
                    loadThrustAnalysis()
                ]);
                
                if (!repoResponse.ok) {
                    throw new Error(`HTTP error! status: ${repoResponse.status}`);
                }
                const data = await repoResponse.json();
                allRepos = data.repositories || [];
                filteredRepos = [...allRepos];
                currentDataset = dataset;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('repoGrid').style.display = 'grid';
                
                updateStats();
                // Apply default filter (100+ Stars)
                applyFilters('');
                updateHeader();
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = `
                    <p>❌ Error loading ${dataset} data. ${error.message}</p>
                    <p>Please make sure the data file is available.</p>
                `;
            }
        }

        // Update statistics
        function updateStats() {
            const totalStars = allRepos.reduce((sum, repo) => sum + Math.max(0, repo.stars), 0);
            const averageStars = Math.round(totalStars / allRepos.length);
            
            document.getElementById('totalRepos').textContent = allRepos.length.toLocaleString();
            document.getElementById('totalStars').textContent = totalStars.toLocaleString();
            document.getElementById('averageStars').textContent = averageStars.toLocaleString();
            document.getElementById('displayedRepos').textContent = filteredRepos.length.toLocaleString();
        }

        // Sort repositories by current ranking criteria
        function sortRepositories(repos) {
            return repos.sort((a, b) => {
                let aValue, bValue;
                
                switch (currentRanking) {
                    case 'stars':
                        return (b.stars || 0) - (a.stars || 0);
                    
                    case 'thrust-patterns':
                        const aThrustData = thrustAnalysisData[a.full_name];
                        const bThrustData = thrustAnalysisData[b.full_name];
                        aValue = aThrustData ? aThrustData.total_thrust_patterns : 0;
                        bValue = bThrustData ? bThrustData.total_thrust_patterns : 0;
                        return bValue - aValue;
                    
                    case 'files-with-thrust':
                        const aThrustFiles = thrustAnalysisData[a.full_name];
                        const bThrustFiles = thrustAnalysisData[b.full_name];
                        aValue = aThrustFiles ? aThrustFiles.files_with_thrust : 0;
                        bValue = bThrustFiles ? bThrustFiles.files_with_thrust : 0;
                        return bValue - aValue;
                    
                    case 'coverage':
                        const aCoverage = thrustAnalysisData[a.full_name];
                        const bCoverage = thrustAnalysisData[b.full_name];
                        aValue = aCoverage ? aCoverage.thrust_percentage : 0;
                        bValue = bCoverage ? bCoverage.thrust_percentage : 0;
                        return bValue - aValue;
                    
                    case 'recent-commit':
                        // Use accurate_last_commit first, fallback to pushed_at, then updated_at
                        const aDate = new Date(a.accurate_last_commit || a.pushed_at || a.updated_at || '1970-01-01');
                        const bDate = new Date(b.accurate_last_commit || b.pushed_at || b.updated_at || '1970-01-01');
                        return bDate.getTime() - aDate.getTime();
                    
                    default:
                        return (b.stars || 0) - (a.stars || 0);
                }
            });
        }

        // Render repositories
        function renderRepositories() {
            const grid = document.getElementById('repoGrid');
            grid.innerHTML = '';
            
            // Sort repositories according to current ranking
            const sortedRepos = sortRepositories([...filteredRepos]);
            
            sortedRepos.forEach((repo, index) => {
                const card = createRepoCard(repo, index + 1);
                grid.appendChild(card);
            });
            
            document.getElementById('displayedRepos').textContent = sortedRepos.length.toLocaleString();
        }

        // Create repository card
        function createRepoCard(repo, rank) {
            const card = document.createElement('div');
            card.className = 'repo-card';
            
            const stars = repo.stars >= 0 ? repo.stars.toLocaleString() : 'N/A';
            const description = repo.description || 'No description available';
            const language = repo.language || 'Unknown';
            const forks = repo.forks ? repo.forks.toLocaleString() : '0';
            // Use accurate_last_commit for the most accurate date (real commits only)
            // Fall back to pushed_at, then updated_at if needed
            const lastCommit = repo.accurate_last_commit || repo.pushed_at || repo.updated_at;
            const updated = lastCommit ? new Date(lastCommit).toLocaleDateString() : 'Unknown';
            
            // Get thrust analysis data if available
            const thrustData = thrustAnalysisData[repo.full_name];
            const thrustSection = thrustData ? `
                <div class="thrust-analysis">
                    <div class="thrust-header">🔥 Thrust Analysis</div>
                    <div class="thrust-stats">
                        <div class="thrust-stat">
                            <span class="thrust-count">${thrustData.total_thrust_patterns.toLocaleString()}</span>
                            <span class="thrust-label">thrust:: patterns</span>
                        </div>
                        <div class="thrust-stat">
                            <span class="thrust-count">${thrustData.total_api_calls.toLocaleString()}</span>
                            <span class="thrust-label">API calls</span>
                        </div>
                        <div class="thrust-stat">
                            <span class="thrust-count">${thrustData.files_with_thrust.toLocaleString()}</span>
                            <span class="thrust-label">files with thrust</span>
                        </div>
                        <div class="thrust-stat">
                            <span class="thrust-count">${thrustData.thrust_percentage.toFixed(1)}%</span>
                            <span class="thrust-label">thrust coverage</span>
                        </div>
                    </div>
                </div>
            ` : '';
            
            card.innerHTML = `
                <div class="repo-header">
                    <a href="${repo.html_url}" target="_blank" class="repo-name">
                        ${repo.full_name}
                    </a>
                    <div class="rank-badge">#${rank}</div>
                </div>
                <div class="star-count">
                    <span class="star-icon">⭐</span>
                    ${stars}
                </div>
                ${thrustSection}
                <div class="repo-description">${description}</div>
                <div class="repo-meta">
                    <div class="meta-item">
                        <span class="language-badge">${language}</span>
                    </div>
                    <div class="meta-item">🍴 ${forks}</div>
                    <div class="meta-item">📅 Last commit: ${updated}</div>
                    ${repo.license !== 'Unknown' ? `<div class="meta-item">📄 ${repo.license}</div>` : ''}
                </div>
                ${repo.topics && repo.topics.length > 0 ? `
                    <div class="topics">
                        ${repo.topics.slice(0, 5).map(topic => `<span class="topic-tag">${topic}</span>`).join('')}
                    </div>
                ` : ''}
            `;
            
            return card;
        }

        // Search functionality
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                applyFilters(query);
            });
        }

        // Filter functionality
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Update active button
                    filterButtons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    currentFilter = e.target.dataset.filter;
                    const searchQuery = document.getElementById('searchInput').value.toLowerCase();
                    applyFilters(searchQuery);
                });
            });
        }

        // Apply filters and search
        function applyFilters(searchQuery = '') {
            filteredRepos = allRepos.filter(repo => {
                // Apply search filter
                const matchesSearch = !searchQuery || 
                    repo.name.toLowerCase().includes(searchQuery) ||
                    (repo.description && repo.description.toLowerCase().includes(searchQuery)) ||
                    (repo.language && repo.language.toLowerCase().includes(searchQuery)) ||
                    (repo.topics && repo.topics.some(topic => topic.toLowerCase().includes(searchQuery)));
                
                if (!matchesSearch) return false;
                
                // Apply category filter
                switch (currentFilter) {
                    case '1000+':
                        return repo.stars >= 1000;
                    case '100+':
                        return repo.stars >= 100;
                    case 'recent':
                        const twoYearsAgo = new Date();
                        twoYearsAgo.setFullYear(twoYearsAgo.getFullYear() - 2);
                        // Use accurate_last_commit for the most accurate recent activity check
                        const lastActivity = repo.accurate_last_commit || repo.pushed_at || repo.updated_at;
                        return lastActivity && new Date(lastActivity) > twoYearsAgo;
                    default:
                        return true;
                }
            });
            
            renderRepositories();
        }

        // Update header information based on current dataset
        function updateHeader() {
            const datasetInfo = document.getElementById('datasetInfo');
            if (currentDataset === 'thrust') {
                datasetInfo.textContent = '📊 Search: "thrust" keyword - 3,142 repositories found across .cu, .h, .cpp, .hpp, .cuh files (Aug 19, 2025)';
            } else {
                datasetInfo.textContent = '📊 Search: "thrust::" namespace - 2,195 repositories';
            }
        }

        // Setup dataset selector
        function setupDatasetSelector() {
            const datasetSelect = document.getElementById('datasetSelect');
            datasetSelect.addEventListener('change', (e) => {
                const selectedDataset = e.target.value;
                loadRepoData(selectedDataset);
            });
        }

        function setupRankingSelector() {
            const rankingSelect = document.getElementById('rankingSelect');
            rankingSelect.addEventListener('change', (e) => {
                currentRanking = e.target.value;
                renderRepositories();
            });
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', () => {
            setupSearch();
            setupFilters();
            setupDatasetSelector();
            setupRankingSelector();
            loadRepoData(currentDataset); // Load default dataset (thrust-namespace)
        });
    </script>
</body>
</html>
