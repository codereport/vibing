<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survivor 51: The Open Era</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
      background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
      border-bottom: 2px solid #333;
    }

    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #f59e0b, #ef4444, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header .subtitle {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: #888;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .episode-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 24px 20px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
    }

    .ep-btn {
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 24px;
      border: 2px solid #444;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .ep-btn:hover { border-color: #888; color: #fff; }
    .ep-btn.active { background: #fff; color: #0a0a0a; border-color: #fff; }
    .ep-btn.active:hover { background: #ddd; border-color: #ddd; }

    .alliances-legend {
      display: none;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .alliances-legend.visible { display: flex; }

    .alliance-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #aaa;
    }

    .alliance-legend-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 2px solid;
    }

    .pool-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #aaa;
    }

    .pool-legend-icon {
      width: 20px;
      height: 20px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
    }

    .pool-legend-icon svg { width: 10px; height: 10px; }

    .tribes-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 50px;
    }

    .tribe {
      border-radius: 16px;
      padding: 30px;
      background: #111;
      border: 1px solid #222;
    }

    .tribe-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid;
    }

    .tribe-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .tribe-name-text {
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .tribe-label {
      font-size: 0.85rem;
      color: #888;
      letter-spacing: 1px;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 20px;
    }

    .player-card {
      position: relative;
      border-radius: 12px;
      overflow: visible;
      background: #1a1a1a;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: default;
    }

    .player-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .player-card.eliminated { filter: grayscale(1); opacity: 0.5; }
    .player-card.eliminated:hover { transform: none; box-shadow: none; }

    .player-card-inner { border-radius: 12px; overflow: hidden; }

    .player-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      overflow: hidden;
    }

    .player-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .x-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
    }

    .eliminated .x-overlay { display: flex; }
    .x-overlay svg { width: 70%; height: 70%; }

    .pool-pick {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 28px;
      height: 28px;
      background: #3b82f6;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      border: 2px solid #fff;
    }

    .pool-pick svg { width: 14px; height: 14px; }
    .pool-pick.visible { display: flex; }

    .player-info { padding: 10px; text-align: center; }

    .player-name {
      font-family: 'Oswald', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .player-season { font-size: 0.75rem; color: #777; margin-top: 3px; }

    .elim-tag {
      display: none;
      font-size: 0.7rem;
      font-weight: 600;
      color: #ef4444;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .eliminated .elim-tag { display: block; }

    .badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 0 6px 8px;
    }

    .badge {
      display: none;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 3px 7px;
      border-radius: 4px;
      white-space: nowrap;
      line-height: 1;
    }

    .badge.visible { display: inline-block; }
    .badge-idol { background: #854d0e; color: #fbbf24; border: 1px solid #a16207; }
    .badge-extra-vote { background: #1e3a5f; color: #60a5fa; border: 1px solid #2563eb; }
    .badge-lost-vote { background: #3f0f0f; color: #f87171; border: 1px solid #991b1b; }
    .badge-boomerang { background: #4a1d6a; color: #c084fc; border: 1px solid #7c3aed; }
    .badge-steal-vote { background: #1a3f2e; color: #34d399; border: 1px solid #059669; }

    .player-card.alliance-highlight {
      outline: 3px solid;
      outline-offset: -1px;
      border-radius: 12px;
    }

    .voted-out-section {
      border-radius: 16px;
      padding: 30px;
      background: #0d0d0d;
      border: 1px solid #1a1a1a;
    }

    .voted-out-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #333;
    }

    .voted-out-header .tribe-dot { background: #555; }

    .voted-out-header .tribe-name-text {
      color: #555;
      font-family: 'Oswald', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .voted-out-grid {
      display: grid;
      gap: 20px;
    }

    .voted-out-section .player-card {
      filter: grayscale(1);
      opacity: 0.5;
    }

    .voted-out-section .player-card:hover {
      transform: none;
      box-shadow: none;
    }

    .voted-out-section .x-overlay { display: flex; }
    .voted-out-section .elim-tag { display: block; }

    .legend a { color: #888; }

    .legend {
      text-align: center;
      padding: 20px;
      color: #555;
      font-size: 0.8rem;
      border-top: 1px solid #1a1a1a;
    }

    @media (max-width: 900px) {
      .players-grid, .voted-out-grid {
        grid-template-columns: repeat(7, minmax(130px, 1fr)) !important;
        overflow-x: auto;
      }
      .single-player-grid { grid-template-columns: minmax(130px, 175px) !important; }
      .tribe { padding: 16px; }
      .tribe-name-text { font-size: 1.4rem; }
      .player-info { padding: 8px; }
      .player-name { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>Survivor 51</h1>
  <div class="subtitle">The Open Era</div>
</header>

<nav class="episode-bar">
  <button class="ep-btn active" data-ep="0">Pre-Game</button>
  <button class="ep-btn" data-ep="1">Episode 1</button>
</nav>

<div class="alliances-legend" id="alliances-legend"></div>

<main class="tribes-container" id="tribes-container"></main>

<footer class="legend">
  Survivor 51: The Open Era &mdash; through Episode 1, September 23, 2026 &middot;
  <a href="https://www.paramountpressexpress.com/cbs-entertainment/shows/survivor/releases/?view=113157-survivor-reveals-the-21-new-castaways-competing-on-the-51st-edition-the-first-in-the-series-new-open-era-with-a-two-hour-season-premiere-on-wednesday">Cast photos: Robert Voets/CBS</a> &middot;
  <a href="https://www.paramountplus.com/sneak-peak/survivor-season-51-episode-1-recap/">Episode recap</a>
</footer>

<script>
  // === PLAYER DATA ===
  const players = {
    aaliyah_puglia:      { name: 'Aaliyah Puglia',   season: 'Toka',          img: 'aaliyah_puglia.jpg',      elimTag: 'Voted Out — Ep. 1' },
    alexis_levine:       { name: 'Alexis Levine',    season: 'Savu',          img: 'alexis_levine.jpg',       elimTag: '' },
    an_nguyen:           { name: 'Thien An Nguyen',  season: 'Toka',          img: 'an_nguyen.jpg',           elimTag: '' },
    ana_sani:            { name: 'Ana Sani',         season: 'Savu',          img: 'ana_sani.jpg',            elimTag: '' },
    angelica_loblack:    { name: 'Jelly Loblack',    season: 'Toka',          img: 'angelica_loblack.jpg',    elimTag: '' },
    brady_booker:        { name: 'Brady Booker',     season: 'Toka',          img: 'brady_booker.jpg',        elimTag: '' },
    carter_krull:        { name: 'Carter Krull',     season: 'Savu',          img: 'carter_krull.jpg',        elimTag: '' },
    cristian_chavez:     { name: 'Cristian Chavez',  season: 'Savu',          img: 'cristian_chavez.jpg',     elimTag: '' },
    danny_kilby:         { name: 'Danny Kilby',      season: 'Toka',          img: 'danny_kilby.jpg',         elimTag: '' },
    devin_way:           { name: 'Devin Way',        season: 'Toka',          img: 'devin_way.jpg',           elimTag: '' },
    eric_macksoud:       { name: 'Eric Macksoud',    season: 'Savu',          img: 'eric_macksoud.jpg',       elimTag: '' },
    jenna_doore:         { name: 'Jenna Doore',      season: 'Toka',          img: 'jenna_doore.jpg',         elimTag: '' },
    kristin_flickinger:  { name: 'Kristin Flickinger',season: 'Savu',         img: 'kristin_flickinger.jpg',  elimTag: '' },
    lewis_kelly:         { name: 'Lewis Kelly',      season: 'Exile',         img: 'lewis_kelly.jpg',         elimTag: '' },
    linnea_capobianco:   { name: 'Linnea Capobianco',season: 'Savu',          img: 'linnea_capobianco.jpg',   elimTag: '' },
    maggie_nestor:       { name: 'Maggie Nestor',    season: 'Toka',          img: 'maggie_nestor.jpg',       elimTag: '' },
    mike_pinsky:         { name: 'Mike Pinsky',      season: 'Toka',          img: 'mike_pinsky.jpg',         elimTag: '' },
    ori_jean_charles:    { name: 'Ori Jean-Charles', season: 'Savu',          img: 'ori_jean_charles.jpg',    elimTag: '' },
    patt_cannaday:       { name: 'Patt Cannaday',    season: 'Toka',          img: 'patt_cannaday.jpg',       elimTag: '' },
    rob_antonson:        { name: 'Rob Antonson',     season: 'Savu',          img: 'rob_antonson.jpg',        elimTag: '' },
    sharonda_cox:        { name: 'Sharonda Cox',     season: 'Savu',          img: 'sharonda_cox.jpg',        elimTag: '' },
  };

  // === TRIBE DEFINITIONS (keyed by episode range) ===
  const tribeColors = {
    Toka:  { color: '#facc15', label: 'Yellow Tribe' },
    Savu:  { color: '#a855f7', label: 'Purple Tribe' },
    Exile: { color: '#64748b', label: 'No Starting Tribe' },
  };

  const tribesByEpisode = {
    0: {
      Toka: ['aaliyah_puglia','an_nguyen','angelica_loblack','brady_booker','danny_kilby','devin_way','jenna_doore','maggie_nestor','mike_pinsky','patt_cannaday'],
      Savu: ['alexis_levine','ana_sani','carter_krull','cristian_chavez','eric_macksoud','kristin_flickinger','linnea_capobianco','ori_jean_charles','rob_antonson','sharonda_cox'],
      Exile: ['lewis_kelly'],
    },
  };

  // === GAME DATA ===
  const eliminations = {
    1: ['aaliyah_puglia'],
  };

  // Add personal picks here as episodes air.
  const poolPicks = {};

  const advantages = {
    1: [{ player: 'rob_antonson', type: 'idol', label: 'Immunity Idol' }],
  };

  const alliances = {
    1: [
      { name: 'Brady & Devin', color: '#22d3ee', members: ['brady_booker','devin_way'] },
      { name: 'Patt & Jenna', color: '#f472b6', members: ['patt_cannaday','jenna_doore'] },
      { name: 'Eric / Ana / Carter', color: '#34d399', members: ['eric_macksoud','ana_sani','carter_krull'] },
    ],
  };

  // === RENDERING ===

  const xSvg = `<svg viewBox="0 0 100 100"><line x1="15" y1="15" x2="85" y2="85" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/><line x1="85" y1="15" x2="15" y2="85" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/></svg>`;
  const poolSvg = `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="white"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="white"/></svg>`;

  function buildCard(id) {
    const p = players[id];
    return `<div class="player-card" data-player="${id}">
      <div class="pool-pick">${poolSvg}</div>
      <div class="player-card-inner">
        <div class="player-img-wrap">
          <img src="images/${p.img}" alt="${p.name}" loading="lazy">
          <div class="x-overlay">${xSvg}</div>
        </div>
        <div class="player-info">
          <div class="player-name">${p.name}</div>
          <div class="player-season">${p.season}</div>
          <div class="elim-tag">${p.elimTag}</div>
        </div>
        <div class="badges"></div>
      </div>
    </div>`;
  }

  function buildTribe(tribeName, memberIds) {
    const tc = tribeColors[tribeName];
    const cols = Math.min(Math.max(memberIds.length, 1), 7);
    const single = memberIds.length === 1;
    const gridColumns = single ? 'minmax(130px, 175px)' : `repeat(${cols},1fr)`;
    return `<section class="tribe">
      <div class="tribe-header" style="border-color:${tc.color}">
        <div class="tribe-dot" style="background:${tc.color}"></div>
        <div>
          <div class="tribe-name-text" style="color:${tc.color}">${tribeName}</div>
          <div class="tribe-label">${tc.label}</div>
        </div>
      </div>
      <div class="players-grid${single ? ' single-player-grid' : ''}" style="grid-template-columns:${gridColumns}">
        ${memberIds.map(id => buildCard(id)).join('')}
      </div>
    </section>`;
  }

  const container = document.getElementById('tribes-container');
  const legendEl = document.getElementById('alliances-legend');
  const buttons = document.querySelectorAll('.ep-btn');

  function getTribesForEp(ep) {
    let tribes = tribesByEpisode[0];
    for (const key of Object.keys(tribesByEpisode).map(Number).sort((a,b) => a-b)) {
      if (key <= ep) tribes = tribesByEpisode[key];
    }
    return tribes;
  }

  function setEpisode(ep) {
    buttons.forEach(b => b.classList.toggle('active', parseInt(b.dataset.ep) === ep));

    // Build eliminated set
    const eliminatedSet = new Set();
    for (let e = 1; e <= ep; e++) {
      if (eliminations[e]) eliminations[e].forEach(p => eliminatedSet.add(p));
    }

    // Pool picks
    const poolSet = new Set();
    for (let e = 1; e <= ep; e++) {
      if (poolPicks[e]) poolSet.add(poolPicks[e]);
    }

    // Advantages
    let currentAdvantages = [];
    for (let e = ep; e >= 1; e--) {
      if (advantages[e]) { currentAdvantages = advantages[e]; break; }
    }
    const advMap = {};
    currentAdvantages.forEach(a => {
      if (!advMap[a.player]) advMap[a.player] = [];
      advMap[a.player].push(a);
    });

    // Alliances
    let currentAlliances = [];
    for (let e = ep; e >= 1; e--) {
      if (alliances[e]) { currentAlliances = alliances[e]; break; }
    }
    const allianceMap = {};
    currentAlliances.forEach(a => {
      a.members.forEach(m => {
        if (!allianceMap[m]) allianceMap[m] = [];
        allianceMap[m].push(a);
      });
    });

    // Render tribes
    const tribes = getTribesForEp(ep);
    const allTribeMembers = new Set(Object.values(tribes).flat());
    const votedOutList = [];
    for (let e = 1; e <= ep; e++) {
      if (eliminations[e]) {
        eliminations[e].forEach(id => {
          if (!allTribeMembers.has(id)) votedOutList.push(id);
        });
      }
    }

    let html = Object.entries(tribes).map(([name, members]) => buildTribe(name, members)).join('');

    if (votedOutList.length > 0) {
      const cols = Math.min(Math.max(votedOutList.length, 1), 7);
      html += `<section class="voted-out-section">
        <div class="voted-out-header">
          <div class="tribe-dot"></div>
          <div>
            <div class="tribe-name-text">Voted Out</div>
          </div>
        </div>
        <div class="voted-out-grid" style="grid-template-columns:repeat(${cols},1fr)">
          ${votedOutList.map(id => buildCard(id)).join('')}
        </div>
      </section>`;
    }

    container.innerHTML = html;

    // Apply state to cards
    container.querySelectorAll('.player-card').forEach(card => {
      const id = card.dataset.player;

      if (eliminatedSet.has(id)) card.classList.add('eliminated');

      const poolIcon = card.querySelector('.pool-pick');
      if (poolSet.has(id) && ep > 0) poolIcon.classList.add('visible');

      const badgesEl = card.querySelector('.badges');
      if (ep > 0 && advMap[id] && !eliminatedSet.has(id)) {
        advMap[id].forEach(adv => {
          const badge = document.createElement('span');
          badge.className = `badge badge-${adv.type} visible`;
          badge.textContent = adv.label;
          badgesEl.appendChild(badge);
        });
      }

      card.classList.remove('alliance-highlight');
      card.style.outlineColor = '';
      if (ep > 0 && allianceMap[id] && !eliminatedSet.has(id)) {
        card.classList.add('alliance-highlight');
        card.style.outlineColor = allianceMap[id][0].color;
      }
    });

    // Legend
    legendEl.innerHTML = '';
    if (ep > 0 && (currentAlliances.length > 0 || poolSet.size > 0)) {
      legendEl.classList.add('visible');
      if (poolSet.size > 0) {
        const item = document.createElement('div');
        item.className = 'pool-legend';
        item.innerHTML = `<div class="pool-legend-icon"><svg viewBox="0 0 24 24" fill="none" width="10" height="10"><circle cx="12" cy="8" r="4" fill="white"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="white"/></svg></div> My Pool Pick`;
        legendEl.appendChild(item);
      }
      currentAlliances.forEach(a => {
        const item = document.createElement('div');
        item.className = 'alliance-legend-item';
        item.innerHTML = `<div class="alliance-legend-swatch" style="background:${a.color}33;border-color:${a.color}"></div> ${a.name}`;
        legendEl.appendChild(item);
      });
    } else {
      legendEl.classList.remove('visible');
    }
  }

  buttons.forEach(btn => {
    btn.addEventListener('click', () => setEpisode(parseInt(btn.dataset.ep)));
  });

  const maxEp = Math.max(...Array.from(buttons).map(b => parseInt(b.dataset.ep)));
  setEpisode(maxEp);
</script>

</body>
</html>
